name: Cloudflare release contract

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: cloudflare-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-contract:
    name: Build and test Cloudflare release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      RELEASE_VERSION: cloudflare
      GITCOMMIT: cloudflare

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 8.15.7
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete Cloudflare release contract
        run: pnpm build:cloudflare
