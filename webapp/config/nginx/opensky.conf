server {
  listen      80;
  server_name _;

  root   /usr/share/nginx/html;
  index  index.html index.htm;
  error_page 404 /404.html;

  location = /404.html {
    internal;
  }

  # don't fall back to index.html on file not found for those extensions
  location ~* \.(js|json|wasm|gif|png|jpg|jpeg|ttf|map)$ {
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
