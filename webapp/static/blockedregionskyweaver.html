      font-weight: 500;
      font-size: 15px;
      line-height: 18px;
      font-family: 'Barlow Condensed', sans-serif;
      margin-top: 0px;
      margin-bottom: 16px;

      position: absolute;
      left: 0px;
      top: 0px;
      padding: 60px;
    }

    .buttons__container {
      margin-top: 16px;
    }

    .button {
      width: 210px;
      height: 42px;
      margin-right: 16px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 500;
      font-size: 18px;
      margin-bottom: 16px;
      line-height: 22px;
      color: white;
      font-family: 'Barlow Condensed', sans-serif;
      clip-path: polygon(
        0% 0%,
        calc(100% - 6px) 0%,
        100% 6px,
        100% 100%,
        6px 100%,
        0% calc(100% - 6px)
      );
      inset: 1px;
      background: linear-gradient(180deg, #4d3c7b 46.09%, #40306b 46.77%);
      z-index: 2;
    }

    .button__outline {
      width: 212px;
      height: 44px;
      background: #705bab;
      position: absolute;
      z-index: 1;
      clip-path: polygon(
        0% 0%,
        calc(100% - 6px) 0%,
        100% 6px,
        100% 100%,
        6px 100%,
        0% calc(100% - 6px)
      );
    }

    .notice__link {
      color: #ac8fff;
    }

    .header__text {
      font-family: Barlow Condensed;
      font-style: normal;
      font-weight: 600;
      color: white;
      font-size: 26px;
      line-height: 28px;
      margin-bottom: 16px;
      margin-top: 16px;
      display: flex;
      align-items: center;
    }

    .notice__container {
      width: 310px;
    }

    .button__outline--green {
      background: #86fbb4;
    }

    .button--green {
      background: linear-gradient(180deg, #3eb06b 46.09%, #309d5b 46.78%);
    }

    .block {
      display: block;
    }

    a {
      text-decoration: none;
      display: inline-block;
      position: relative;
    }
