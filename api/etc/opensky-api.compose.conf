##
## Service
##

[service]
  name          = "opensky-api-local"
  listen        = "0.0.0.0:1337"
  mode          = "development"

  cookie_domain   = "localhost"

#[ssl]
#  cert_path = "./etc/ssl/star_0xhorizon_net.crt"
#  key_path = "./etc/ssl/star_0xhorizon_net.key"

[logging]
  level         = "INFO"
  json          = false
  concise       = false

[auth]
  jwt_secret    = "changemenow"

##
## DB
##

[db]
  database          = "opensky"
  hosts             = [ "postgres" ]
  username          = "postgres"
  password          = "postgres"
  debug_queries     = false
  max_open_conns    = 20
  max_idle_conns    = 10
  conn_max_lifetime = "1800s"
  app_name          = "opensky-api"

[db-migrations]
  driver        = "postgres"
  dir           = "./data/schema/migrations"

[redis]
  enabled = false

